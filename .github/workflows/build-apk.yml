name: Build Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Arm64 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Restore Gradle Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: "r29"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: jni/deltachat-core-rust

      - name: Check prebuilt core
        id: prebuilt-core
        run: |
          if [ -f "jni/arm64-v8a/libdeltachat.a" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Prebuilt core found in repository, skipping compilation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Prebuilt core not found, compiling..."
          fi

      - name: Compile core
        if: steps.prebuilt-core.outputs.exists != 'true'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          scripts/install-toolchains.sh && scripts/ndk-make.sh arm64-v8a

      - name: Upload Prebuilt Core (for optional inclusion in repo)
        uses: actions/upload-artifact@v4
        with:
          name: deltachat-prebuilt-core-arm64
          path: jni/arm64-v8a/*.a
          if-no-files-found: ignore

      - name: Build APK
        run: ./gradlew --no-daemon -PABI_FILTER=arm64-v8a assembleFossDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deltachat-arm64-debug.apk
          path: build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
